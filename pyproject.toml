[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-page-editor"
version = "2.1.0"
description = "PDF 页数编辑器 —— 拆分、重组、合并 PDF 与图片的桌面小工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pdf", "split", "merge", "pyside6", "pymupdf", "desktop"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.5"]

[project.gui-scripts]
pdf-page-editor = "pdf_editor.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_editor = ["resources/*.png", "resources/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
